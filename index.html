<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TWolvesTV</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  .slides-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 60px);
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    background: #000000;
  }

  .slide.active {
    opacity: 1;
    z-index: 1;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* ---- Welcome slide ---- */
  #slide-welcome {
    flex-direction: column;
    background: #000000;
    gap: 3vh;
  }

  .welcome-title {
    color: #ffffff;
    font-weight: bold;
    font-size: 6vh;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    font-family: Arial, Helvetica, sans-serif;
    text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
  }

  .welcome-title .accent {
    color: #ffcc00;
  }

  #slide-welcome img {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    object-fit: fill;
  }

 /* ---- Bottom scrolling ticker ---- */
  .ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #000000;
    color: #ffffff;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    border-top: 3px solid #1fbfb0;
  }

  .ticker-label {
    flex: 0 0 auto;
    background: #1fbfb0;
    color: #000000;
    font-weight: bold;
    font-size: 20px;
    padding: 0 18px;
    height: 100%;
    display: flex;
    align-items: center;
    z-index: 2;
  }

  .ticker-track {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    height: 100%;
  }

  .ticker-content {
    position: absolute;
    top: 0;
    left: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 22px;
    padding-right: 100px;
    animation: scroll-left linear infinite;
    /* animation-duration is set dynamically in JS based on text length */
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
</style>
</head>
<body>

  <div class="slides-area">
    <div class="slide active" id="slide-calendar">
      <iframe
        src="https://www.gobound.com/widgets/67aa3cf8b46247fc8947"
        allowtransparency="true">
      </iframe>
    </div>

    <div class="slide" id="slide-menu">
      <img src="https://www.southwestvalley.org/images/library/aug_hs_08-2026.jpg" alt="Lunch Menu" onerror="this.dataset.broken='true';">
    </div>

    <div class="slide" id="slide-welcome">
      
      <img src="Welcome HS.png" alt="Southwest Valley Wolves Logo" onerror="this.dataset.broken='true';">
    </div>
  </div>

  <div class="ticker-bar">
    <div class="ticker-label">BULLETIN</div>
    <div class="ticker-track">
      <div class="ticker-content" id="ticker-content">Loading bulletin&hellip;</div>
    </div>
  </div>

  <script>
    // =========================================================
    // SLIDE ROTATION SETTINGS
    // =========================================================
    const CALENDAR_DURATION = 8000; // 20 seconds
    const MENU_DURATION = 8000;     // 15 seconds
    const WELCOME_DURATION = 8000;  // 12 seconds

    const slides = [
      { el: document.getElementById('slide-calendar'), duration: CALENDAR_DURATION },
      { el: document.getElementById('slide-menu'), duration: MENU_DURATION },
      { el: document.getElementById('slide-welcome'), duration: WELCOME_DURATION }
    ];

    let current = 0;

    function slideIsBroken(slideEl) {
      const img = slideEl.querySelector('img');
      return img && img.dataset.broken === 'true';
    }

    function showSlide(index) {
      slides.forEach((s, i) => {
        s.el.classList.toggle('active', i === index);
      });
    }

    function nextSlide() {
      let attempts = 0;
      do {
        current = (current + 1) % slides.length;
        attempts++;
      } while (slideIsBroken(slides[current].el) && attempts < slides.length);
      showSlide(current);
      setTimeout(nextSlide, slides[current].duration);
    }

    setTimeout(nextSlide, slides[current].duration);

    // =========================================================
    // BOTTOM TICKER: pulls text from the published "Daily Bulletin"
    // Google Doc. The doc says it auto-updates every 5 minutes, so
    // this re-fetches on the same schedule.
    //
    // r.jina.ai converts the page into clean, pre-stripped plain
    // text (no CSS/script code to leak through), and also handles
    // the cross-origin permission issue for us.
    // =========================================================

    const DOC_URL = "https://docs.google.com/document/d/e/2PACX-1vTVrvzPI9wy9MZ1kT2JcefS0ErqAfb6UMCPLMjQsbaHTjnGDTPLEgCwiBiHlng1VVJkG2wZNo5Qim7n/pub";
    const PROXY_URL = "https://r.jina.ai/" + DOC_URL;
    const REFRESH_MS = 5 * 60 * 1000; // 5 minutes, matches the doc's own update cadence

    // Fallback text, captured from the live doc as of setup time.
    // Only shown if the live fetch fails.
    const FALLBACK_TEXT = "Daily Bulletin — Monday, August 24, 2026 — 1st DAY OF '26/'27 SCHOOL YEAR! — Breakfast: French Toast Sticks & Mixed Fruit | Lunch: Mozzarella Stuffed Breadsticks & Green Beans — 1st Day of High School starts @ 8:15am! — Good Luck to our Tennis Girls, Volleyball, & Football! — Students please check your email daily. — Wolf Perks open Fridays during Den, cash only. — REMINDER: Open Campus Lunch — Juniors and Seniors, report back on time for class. — REMINDER: Transfer bus leaves at 3:10 to go back to Villisca. — REMINDER: Vending Machines are OFF from 8:30am - 3:45pm.";

    const tickerEl = document.getElementById('ticker-content');

    function setTickerText(text) {
      tickerEl.textContent = text;
      // Speed: roughly 90 pixels per second, scaled to text length
      const estimatedWidth = text.length * 13; // rough px estimate
      const duration = Math.max(20, estimatedWidth / 150);
      tickerEl.style.animation = 'none';
      // force reflow so the animation restarts cleanly
      void tickerEl.offsetWidth;
      tickerEl.style.animation = `scroll-left ${duration}s linear infinite`;
    }

    function cleanExtractedText(rawText) {
      return rawText
        // strip any stray HTML tags and CSS-looking rule blocks that
        // could slip through as literal text
        .replace(/<[^>]*>/g, ' ')
        .replace(/\.[\w-]+\{[^}]*\}/g, ' ')
        .split('\n')
        .map(line => line.trim())
        .filter(line =>
          line.length > 0 &&
          !line.startsWith('Title:') &&
          !line.startsWith('URL Source:') &&
          !line.startsWith('Markdown Content:') &&
          !line.startsWith('[') &&
          line !== 'Published using Google Docs' &&
          line !== 'Report abuse' &&
          line !== 'Learn more'
        )
        .join('   •   ')
        // collapse any repeated whitespace left over from cleanup
        .replace(/\s{2,}/g, ' ');
    }

    function fetchBulletin() {
      fetch(PROXY_URL)
        .then(res => {
          if (!res.ok) throw new Error('Bad response');
          return res.text();
        })
        .then(rawText => {
          const cleaned = cleanExtractedText(rawText);
          if (cleaned && cleaned.length > 20) {
            setTickerText(cleaned);
          } else {
            throw new Error('Empty content');
          }
        })
        .catch(err => {
          console.warn('Bulletin fetch failed, using fallback text.', err);
          setTickerText(FALLBACK_TEXT);
        });
    }

    fetchBulletin();
    setInterval(fetchBulletin, REFRESH_MS);
  </script>

</body>
</html>
